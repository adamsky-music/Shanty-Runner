<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shanti Runner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #212121;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #gameCanvas {
      background: #87CEEB;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 100%;
      touch-action: manipulation;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="250"></canvas>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) tg.expand();

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Уровни (высота Y)
  const GROUND_Y = 160; 
  const UPPER_Y = 90;

  // Размеры Шанти на экране
  const DOG_RENDER_W = 64;
  const DOG_RENDER_H = 64;

  let score = 0;
  let gameOver = false;
  let frame = 0;
  let rainbowTimer = 0;

  // Переменная для бесконечной прокрутки земли
  let groundX = 0;
  const GROUND_SPEED = 3; // Скорость бега травы (должна совпадать со скоростью предметов)

  // Игрок (Шанти)
  const dog = {
    x: 40,
    y: GROUND_Y,
    width: DOG_RENDER_W,
    height: DOG_RENDER_H,
    vy: 0,
    gravity: 0.6,
    jumpForce: -11,
    isGrounded: true
  };

  // Загрузка изображений
  const sprites = {
    shanti: new Image(),
    bg: new Image(),
    ground: new Image(),
    food: new Image(),
    water: new Image(),
    poop: new Image(),
    cupcake: new Image(),
    cat: new Image()
  };

  // Файлы графики
  sprites.shanti.src = 'shanti_spritesheet.png'; 
  sprites.bg.src = 'bg.png';
  sprites.ground.src = 'ground.png';
  sprites.food.src = 'food.png';
  sprites.water.src = 'water.png';
  sprites.poop.src = 'poop.png';
  sprites.cupcake.src = 'cupcake.png';
  sprites.cat.src = 'cat_spritesheet.png'; 

  let items = [];
  let cats = [];

  function jump() {
    if (gameOver) {
      restart();
      return;
    }
    if (dog.isGrounded) {
      dog.vy = dog.jumpForce;
      dog.isGrounded = false;
    }
  }

  window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
  window.addEventListener('mousedown', jump);
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });

  function spawnEntities() {
    if (frame % 70 === 0) {
      const level = Math.random() > 0.5 ? GROUND_Y + 15 : UPPER_Y + 15;
      const rand = Math.random();
      const objParams = { x: 420, y: level, size: 28 };

      if (level === GROUND_Y + 15) {
        if (rand < 0.4) items.push({ ...objParams, type: 'food' });
        else if (rand < 0.7) items.push({ ...objParams, type: 'water' });
        else if (rand < 0.9) items.push({ ...objParams, type: 'poop', size: 24 });
        else items.push({ ...objParams, type: 'cupcake', size: 30 });
      } else {
        if (rand < 0.45) items.push({ ...objParams, type: 'food' });
        else if (rand < 0.9) items.push({ ...objParams, type: 'water' });
        else items.push({ ...objParams, type: 'cupcake', size: 30 });
      }
    }

    if (frame % 230 === 0 && Math.random() < 0.6) {
      cats.push({ x: 440, y: GROUND_Y + 18, width: 36, height: 36, speed: 4 });
    }
  }

  function update() {
    if (gameOver) return;
    frame++;

    // Сдвиг земли для эффекта бега
    groundX = (groundX - GROUND_SPEED) % canvas.width;

    dog.vy += dog.gravity;
    dog.y += dog.vy;

    if (dog.y >= GROUND_Y) {
      dog.y = GROUND_Y;
      dog.vy = 0;
      dog.isGrounded = true;
    }

    if (rainbowTimer > 0) rainbowTimer--;

    // Коллизии предметов
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.x -= GROUND_SPEED;
      if (Math.abs(dog.x - item.x) < 25 && Math.abs(dog.y - item.y) < 25) {
        if (item.type === 'food' || item.type === 'water') score += 1;
        else if (item.type === 'poop') score = Math.max(0, score - 2);
        else if (item.type === 'cupcake') { score += 10; rainbowTimer = 120; }
        items.splice(i, 1); continue;
      }
      if (item.x < -30) items.splice(i, 1);
    }

    // Движение и коллизии котов
    for (let i = cats.length - 1; i >= 0; i--) {
      let cat = cats[i];
      cat.x -= cat.speed;
      if (Math.abs(dog.x - cat.x) < 22 && Math.abs(dog.y - cat.y) < 22) { gameOver = true; }
      if (cat.x < -40) cats.splice(i, 1);
    }
    spawnEntities();
  }

  function drawShanti() {
    let frameX = 0;
    let frameY = 0;

    if (!dog.isGrounded) {
      frameY = 2; // Строка 2 — Прыжок
      frameX = dog.vy < 0 ? 0 : 1; 
    } else {
      let runIndex = Math.floor(frame / 5) % 8; // 8 кадров бега
      frameX = runIndex % 4;                    // Колонки 0-3
      frameY = Math.floor(runIndex / 4);         // Строки 0 и 1
    }

    const frameW = sprites.shanti.width / 4;
    const frameH = sprites.shanti.height / 4;

    ctx.drawImage(
      sprites.shanti,
      frameX * frameW, frameY * frameH,
      frameW, frameH,
      dog.x, dog.y,
      dog.width, dog.height
    );
  }

  function drawCat(cat) {
    if (!sprites.cat.complete || sprites.cat.naturalWidth === 0) return;

    const cols = 4;
    const rows = 5;

    const catFrameW = sprites.cat.naturalWidth / cols;
    const catFrameH = sprites.cat.naturalHeight / rows;

    let catFrameX = Math.floor(frame / 6) % cols; 
    let catFrameY = 0; 

    ctx.drawImage(
      sprites.cat,
      catFrameX * catFrameW, catFrameY * catFrameH,
      catFrameW, catFrameH,
      cat.x, cat.y,
      cat.width, cat.height
    );
  }

  // Отрисовка зацикленного бега земли
  function drawGround() {
    if (sprites.ground.complete && sprites.ground.naturalWidth !== 0) {
      // Рисуем две копии подряд, чтобы перекрыть весь экран при прокрутке
      ctx.drawImage(sprites.ground, groundX, 205, canvas.width, 45);
      ctx.drawImage(sprites.ground, groundX + canvas.width, 205, canvas.width, 45);
    } else {
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(0, 205, canvas.width, 45);
    }
  }

  function draw() {
    // 1. Отрисовка статичного фона (небо)
    if (sprites.bg.complete && sprites.bg.naturalWidth !== 0) {
      ctx.drawImage(sprites.bg, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.imageSmoothingEnabled = false;

    // Вспомогательная линия верхнего уровня
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(0, UPPER_Y + 35); ctx.lineTo(400, UPPER_Y + 35); ctx.stroke(); ctx.setLineDash([]);

    // 2. Движущаяся земля
    drawGround();

    // Радуга за Шанти
    if (rainbowTimer > 0) {
      const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082'];
      colors.forEach((c, idx) => { ctx.fillStyle = c; ctx.fillRect(dog.x - 35, dog.y + 20 + (idx * 2), 35, 2); });
    }

    // Отрисовка Шанти
    if (sprites.shanti.complete && sprites.shanti.naturalWidth !== 0) {
      drawShanti();
    } else {
      ctx.font = '30px serif'; ctx.fillText('🐶', dog.x, dog.y + 30);
    }

    // Отрисовка бонусов
    items.forEach(item => {
      const img = sprites[item.type];
      if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, item.x, item.y, item.size, item.size);
      } else {
        let icon = '🥣';
        if (item.type === 'water') icon = '💧';
        if (item.type === 'poop') icon = '💩';
        if (item.type === 'cupcake') icon = '🧁';
        ctx.font = '24px serif'; ctx.fillText(icon, item.x, item.y + 20);
      }
    });

    // Отрисовка кота
    cats.forEach(cat => {
      if (sprites.cat.complete && sprites.cat.naturalWidth !== 0) {
        drawCat(cat);
      } else {
        ctx.font = '28px serif'; ctx.fillText('🐈', cat.x, cat.y + 25);
      }
    });

    // Счет
    ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(`Очки: ${score}`, 15, 30);
    
    // Экран окончания игры
    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
      ctx.font = 'bold 24px sans-serif'; ctx.fillText('Игра окончена!', canvas.width / 2, 110);
      ctx.font = '16px sans-serif'; ctx.fillText(`Итоговый счет: ${score}`, canvas.width / 2, 140);
      ctx.fillText('Нажмите для рестарта', canvas.width / 2, 170); ctx.textAlign = 'left';
    }
  }

  function restart() {
    score = 0; gameOver = false; items = []; cats = []; dog.y = GROUND_Y; dog.vy = 0; dog.isGrounded = true; frame = 0; groundX = 0;
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }

  window.onload = loop;
</script>
</body>
</html>
